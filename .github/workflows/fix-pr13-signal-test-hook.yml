name: Fix PR13 signal test hook

on:
  push:
    branches:
      - claude/binding-handoff-review-0ajqcl
    paths:
      - tools/fix_pr13_signal_test_hook.py
      - .github/workflows/fix-pr13-signal-test-hook.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/binding-handoff-review-0ajqcl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply test hook correction
        run: python tools/fix_pr13_signal_test_hook.py
      - name: Validate
        run: |
          python -m compileall -q tests
          git diff --check
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct PR13 signal recovery test hooks"
          git push origin HEAD:claude/binding-handoff-review-0ajqcl
