name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install --requirement requirements-dev.lock
      - run: python -X dev -m unittest discover -s tests -v
      - run: python -m compileall -q app tests
      - run: ruff check --select E9,F63,F7,F82 app tests
