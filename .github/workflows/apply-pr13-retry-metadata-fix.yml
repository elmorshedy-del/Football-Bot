name: Apply PR13 retry metadata fix

on:
  push:
    branches:
      - claude/binding-handoff-review-0ajqcl

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/binding-handoff-review-0ajqcl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply retry metadata ownership fix
        run: python tools/apply_pr13_retry_metadata_fix.py
      - name: Validate focused regression
        run: |
          python -m unittest tests.test_signal_path_ownership.SignalPathOwnershipTests.test_failed_startup_rebuild_retains_retry_owner_then_recovers -v
          python -m unittest tests.test_signal_path_ownership.SignalPathOwnershipTests.test_one_success_cannot_clear_another_failed_watch_fault -v
          python -m py_compile app/engine.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/engine.py tools/apply_pr13_retry_metadata_fix.py .github/workflows/apply-pr13-retry-metadata-fix.yml
          git commit -m "Preserve signal recovery metadata across retry"
          git push origin HEAD:claude/binding-handoff-review-0ajqcl
