name: Refresh PR13 final evidence

on:
  push:
    branches:
      - claude/binding-handoff-review-0ajqcl

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/binding-handoff-review-0ajqcl
          fetch-depth: 0

      - name: Generate reconciled final evidence
        shell: bash
        run: |
          set -euo pipefail
          candidate='cb273b465f6a086d910366056a17987db377d0cf'
          tree='f24518e4b7b07c50611a5cc3df2ce586fd3ef4b8'
          base='8b6a8a8e736f8eb59cec7383a51b38c857947816'
          reviewed='d69f5a4c512fddf55d30cb79079a69e0fa6a1651'
          run='33581738642'
          job='100097262004'
          out='docs/evidence/pr13/cb273b4'
          mkdir -p "$out"

          cat > "$out/ci-validation-gate.txt" <<EOF
          PR #13 final CI validation evidence
          Validated candidate head: $candidate
          Validated candidate tree: $tree
          Base: main / $base
          Reviewed head: $reviewed
          Workflow run: https://github.com/elmorshedy-del/Football-Bot/actions/runs/$run
          Job: test ($job)
          Conclusion: success
          Python: 3.12.14
          Chromium: 151.0.7922.34
          REQUIRE_BROWSER_TESTS: 1
          Strict suite: python -X dev -W error::RuntimeWarning -m unittest discover -s tests -v
          Strict suite result: Ran 331 tests; OK
          Browser/async skip guard suite: Ran 331 tests; OK
          Browser acceptance: executed; no browser skip marker
          Unretrieved async exception guard: passed
          Byte-compile: passed
          Ruff E9,F63,F7,F82: passed
          JavaScript syntax: passed
          Whitespace/conflict checks: passed
          PR state at hand-back: draft, open, unmerged
          Deployment: not performed; section 11 production evidence remains BLOCKED
          Independent approval: required; implementer does not self-approve
          EOF
          sed -i 's/^          //' "$out/ci-validation-gate.txt"

          h_ci=$(sha256sum "$out/ci-validation-gate.txt" | awk '{print $1}')
          h_red=$(sha256sum docs/evidence/pr13/baseline-d69f5a4/baseline-red-tests.txt | awk '{print $1}')
          h_local=$(sha256sum docs/evidence/pr13/0cbf651/local-validation-gate.txt | awk '{print $1}')

          cat > "$out/EVIDENCE_INDEX.md" <<EOF
          # PR 13 final evidence index — validated candidate \`cb273b4\`

          | Field | Value |
          |---|---|
          | Repository | \`elmorshedy-del/Football-Bot\` |
          | Pull request | **#13** — draft, open, unmerged; do not deploy from this hand-back |
          | Validated candidate head | \`$candidate\` |
          | Validated candidate tree | \`$tree\` |
          | Base branch / head | \`main\` / \`$base\` |
          | Reviewed head | \`$reviewed\` |
          | Head branch | \`claude/binding-handoff-review-0ajqcl\` |
          | Runtime mode | Paper only |
          | Railway \`kalchi-kill\` | Untouched |

          ## Machine-readable artifacts

          | Artifact | Path | SHA-256 |
          |---|---|---|
          | Final CI validation gate | \`$out/ci-validation-gate.txt\` | \`$h_ci\` |
          | PR 13 baseline red | \`docs/evidence/pr13/baseline-d69f5a4/baseline-red-tests.txt\` | \`$h_red\` |
          | Historical local gate for candidate 0cbf651 | \`docs/evidence/pr13/0cbf651/local-validation-gate.txt\` | \`$h_local\` |

          The old \`0cbf651\` local gate remains historical evidence only. It is **not** the final candidate record.
          Its hash above is recomputed from the checked-in bytes in this branch.

          ## Continuous integration

          | Field | Value |
          |---|---|
          | Run | https://github.com/elmorshedy-del/Football-Bot/actions/runs/$run |
          | Job | \`test\` (\`$job\`) |
          | Validated head | \`$candidate\` |
          | Conclusion | **success** |
          | Chromium | 151.0.7922.34; launched before tests |
          | Strict suite | **331 tests, OK** |
          | Browser/async guard rerun | **331 tests, OK** |
          | Static gates | compileall, Ruff fatal selection, Node syntax, diff whitespace/conflict checks — all passed |

          Browser acceptance executed on the runner with \`REQUIRE_BROWSER_TESTS=1\`; the guard found no browser-skip marker and no unretrieved Task/Future exception.

          ## Hand-back status

          All implementation/local/CI remediation requested by the PR 13 follow-up review is represented by the validated candidate and its green run above. Production section 11 remains **BLOCKED** because no authorised deployment target/live \`ADMIN_TOKEN\` was supplied. BR-07 remains an independent-review requirement and is not self-approved here.

          This evidence refresh is documentation-only. The validated runtime candidate is the exact clean head \`$candidate\` that run \`$run\` tested.
          EOF
          sed -i 's/^          //' "$out/EVIDENCE_INDEX.md"

          if ! grep -q 'PR 13 final hand-back evidence refresh' docs/DUAL_SLEEVE_CHANGELOG.md; then
            cat >> docs/DUAL_SLEEVE_CHANGELOG.md <<EOF

          ## PR 13 final hand-back evidence refresh

          Documentation-only refresh after the final remediation CI. It supersedes the stale §13 evidence pointers above without rewriting the historical remediation record.

          - Validated candidate head/tree: \`$candidate\` / \`$tree\`.
          - Exact green CI: run \`$run\`, job \`$job\`, Chromium 151.0.7922.34.
          - Strict unit/browser suite: **331 tests, OK**; mandatory browser/async guard rerun: **331 tests, OK**.
          - \`compileall\`, Ruff \`E9,F63,F7,F82\`, \`node --check static/app.js\`, and both diff checks passed.
          - Final machine-readable evidence: \`$out/EVIDENCE_INDEX.md\`.
          - The old \`docs/evidence/pr13/0cbf651/EVIDENCE_INDEX.md\` is historical and must not be used as the current hand-back index.
          - PR remains draft/open/unmerged. No deployment was performed. §11 production evidence remains BLOCKED and BR-07 still requires independent review.
          EOF
            sed -i '/^          ## PR 13 final hand-back evidence refresh/,$ s/^          //' docs/DUAL_SLEEVE_CHANGELOG.md
          fi

          rm .github/workflows/refresh-pr13-final-evidence.yml
          git diff --check
          test "$(sha256sum "$out/ci-validation-gate.txt" | awk '{print $1}')" = "$h_ci"
          test "$(sha256sum docs/evidence/pr13/baseline-d69f5a4/baseline-red-tests.txt | awk '{print $1}')" = "$h_red"
          test "$(sha256sum docs/evidence/pr13/0cbf651/local-validation-gate.txt | awk '{print $1}')" = "$h_local"

      - name: Commit evidence refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/evidence/pr13/cb273b4 docs/DUAL_SLEEVE_CHANGELOG.md .github/workflows/refresh-pr13-final-evidence.yml
          git commit -m "Refresh PR13 final hand-back evidence"
          git push origin HEAD:claude/binding-handoff-review-0ajqcl
