name: Apply remaining PR13 review regressions

on:
  push:
    branches:
      - claude/binding-handoff-review-0ajqcl
    paths:
      - tools/apply_pr13_review_tail.py
      - .github/workflows/apply-pr13-review-tail.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/binding-handoff-review-0ajqcl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply remaining review changes
        run: python tools/apply_pr13_review_tail.py
      - name: Syntax and diff checks
        run: |
          python -m compileall -q app tests
          git diff --check
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete PR13 follow-up review coverage"
          git push origin HEAD:claude/binding-handoff-review-0ajqcl
