name: Apply PR13 follow-up fixes

on:
  push:
    branches:
      - claude/binding-handoff-review-0ajqcl
    paths:
      - tools/apply_pr13_followup.py
      - .github/workflows/apply-pr13-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/binding-handoff-review-0ajqcl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fixes
        run: python tools/apply_pr13_followup.py
      - name: Syntax check
        run: python -m compileall -q app tests
      - name: Diff check
        run: git diff --check
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PR13 follow-up integrity blockers"
          git push origin HEAD:claude/binding-handoff-review-0ajqcl
